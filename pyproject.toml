[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphamaster"
version = "0.1.0"
description = "Standalone PyTorch MASTER experiments using an installed Qlib"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyqlib==0.9.7",
    "PyYAML",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
